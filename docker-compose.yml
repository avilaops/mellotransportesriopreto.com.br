# Producao do site (mellotransportesriopreto.com.br), em
# /opt/mellotransportesriopreto-com-br no servidor applications. Segue a Norma
# de Plataforma (avilaops/infra, NORMA-PLATAFORMA.md): todo nome sai do dominio
# e nenhuma porta e publicada no host.
#
# O site nao tem banco nem segredo: cotacao, lead e rastreio sao repassados ao
# TMS, no endereco gravado na imagem durante o build (TMS_API_URL).
name: mellotransportesriopreto-com-br

services:
  web:
    # O deploy troca esta linha pela imagem do commit, por digest
    # (/var/lib/avilaops/deploy/mellotransportesriopreto.com.br/image.yml).
    image: ghcr.io/avilaops/mellotransportesriopreto.com.br:latest
    container_name: mellotransportesriopreto-com-br-web
    restart: unless-stopped
    expose: ["3000"]
    networks:
      edge:
        # IP fixo enquanto o Caddy roda no host e nao resolve nome de container.
        ipv4_address: 172.31.0.12
    labels:
      avilaops.domain: mellotransportesriopreto.com.br
      avilaops.stack: mello-site
      avilaops.tier: web
      avilaops.backup: "false"
      avilaops.owner: nicolas
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  edge:
    external: true
